[package]
name    = "kotha"
version = "0.1.0"
edition = "2021"
publish = false

# The .deb's `Maintainer:` field comes from here — `authors` wins over
# tauri.conf.json's `publisher`, and Debian wants `Name <email>`. `publisher`
# stays the plain name, which is the right shape for Windows' MSI manufacturer
# and macOS, where an address in that field would look odd.
authors = ["Kayes Ferdous <kayesfardows@gmail.com>"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

# The whole pipeline — engine, VAD, segmenter, corrector, clipboard — already
# lives here and is already measured. The app drives it rather than
# reimplementing it; that is why `live.rs` was promoted from a binary to a
# library module. Renaming this crate is Phase 6 work.
kotha-spike = { path = "../../spike" }
anyhow = "1"
cpal = "0.18.2"

# Phase 5's model download: two HTTPS GETs, one of them 775 MB with a Range
# header. `ureq` is blocking and synchronous, which is what the worker thread
# wants — it owns the engine and there is no async anywhere near it.
#
# Not `reqwest`, even though Tauri lists it: that dependency is Android and iOS
# only, so on desktop it is an entire new tree — hyper, h2, tokio, a TLS stack —
# for two requests. Not `curl` either, tempting as it is with `setup.sh`'s
# invocation already proven, because a shipped app cannot require a binary it
# does not ship on the one path where first-run either works or the user gives
# up.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
serde_json = "1"

# Linux only, and for exactly one call. `set_focusable(false)` maps to GTK's
# `accept_focus`, which stops the pill taking *keyboard* focus but does not stop
# KWin making it the *active window* — and that is what dims the window behind
# it and stops its caret. The cure is the X11 window type hint, which tao does
# not expose, so `no_activate` reaches through `gtk_window()` for it. Pinned to
# the version Tauri already builds, or the types are not the same types.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
