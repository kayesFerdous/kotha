[package]
name    = "kotha"
version = "0.1.0"
edition = "2021"
publish = false

# The .deb's `Maintainer:` field comes from here — `authors` wins over
# tauri.conf.json's `publisher`, and Debian wants `Name <email>`. `publisher`
# stays the plain name, which is the right shape for Windows' MSI manufacturer
# and macOS, where an address in that field would look odd.
authors = ["Kayes Ferdous <kayesfardows@gmail.com>"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is not on by default and is needed for `Image::from_bytes`,
# which is how the macOS template tray icon is compiled in. See `tray_icon`.
#
# `macos-private-api` backs `"macOSPrivateApi": true` in tauri.conf.json, which
# is what lets the pill be transparent on macOS. It is **not** in a
# `cfg(target_os = "macos")` block, and both halves of that are deliberate:
#
#   * tauri-build compares the config against the features and is not
#     platform-gated — `AppConfig::features()` pushes `macos-private-api`
#     whenever the config flag is set, whatever the target. So a Linux build of
#     this same config fails without it too. That is not theoretical; it is how
#     this was found.
#
#   * the check reads the top-level `[dependencies]` only
#     (`find_dependency` → `manifest.dependencies`), so putting it in a target
#     block would satisfy the compiler and not the check.
#
# It costs Linux and Windows nothing. The APIs it guards are written
# `cfg(any(not(target_os = "macos"), feature = "macos-private-api"))` — already
# available off macOS — and the feature pulls in no new dependencies, only
# forwarding to tauri-runtime.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"

# The whole pipeline — engine, VAD, segmenter, corrector, clipboard — already
# lives here and is already measured. The app drives it rather than
# reimplementing it; that is why `live.rs` was promoted from a binary to a
# library module. Renaming this crate is Phase 6 work.
kotha-spike = { path = "../../spike" }
anyhow = "1"
cpal = "0.18.2"

# Phase 5's model download: two HTTPS GETs, one of them 775 MB with a Range
# header. `ureq` is blocking and synchronous, which is what the worker thread
# wants — it owns the engine and there is no async anywhere near it.
#
# Not `reqwest`, even though Tauri lists it: that dependency is Android and iOS
# only, so on desktop it is an entire new tree — hyper, h2, tokio, a TLS stack —
# for two requests. Not `curl` either, tempting as it is with `setup.sh`'s
# invocation already proven, because a shipped app cannot require a binary it
# does not ship on the one path where first-run either works or the user gives
# up.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
serde_json = "1"

# Start at login, from the settings window. On macOS it writes a LaunchAgent
# plist into ~/Library/LaunchAgents — no Automation prompt, unlike its
# AppleScript mode — and on Linux a .desktop file in ~/.config/autostart.
# Checked with `cargo tree -p ct2rs` before and after: it leaves the macOS tree
# under CTranslate2 untouched, so it costs no C++ rebuild.
tauri-plugin-autostart = "2"

# Linux only, and for exactly one call. `set_focusable(false)` maps to GTK's
# `accept_focus`, which stops the pill taking *keyboard* focus but does not stop
# KWin making it the *active window* — and that is what dims the window behind
# it and stops its caret. The cure is the X11 window type hint, which tao does
# not expose, so `no_activate` reaches through `gtk_window()` for it. Pinned to
# the version Tauri already builds, or the types are not the same types.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

# Linux only: a second launch opens Settings in the running copy instead of
# starting another. macOS gets the same from LaunchServices for free (see the
# Reopen handler in main.rs), and on that target this plugin's zbus would turn
# on a `syn` feature under ct2rs and force a full CTranslate2 rebuild.
tauri-plugin-single-instance = "2"

# macOS only, and for the same job `gtk` does on Linux: stopping the pill from
# becoming the active window. Tauri exposes `ns_window()` as a raw pointer and
# nothing above it, so the three AppKit calls in `no_activate` have to be made
# directly.
#
# Pinned to the version Tauri already builds — tao and wry pull exactly this,
# so the `NSWindow` reached through `ns_window()` is the same `NSWindow` this
# crate names. A different major here would be a different type with the same
# spelling, which is the `gtk` note above repeated in Objective-C.
#
# `objc2-app-kit` is cut down to the two features that matter: `NSWindow` for
# the class and `NSResponder` because `NSWindow` inherits from it and the
# generated class definition is gated on it. Cargo unions this with whatever
# tao asks for, so the narrow list documents intent rather than saving build
# time.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSWindow",
    "NSResponder",
] }
