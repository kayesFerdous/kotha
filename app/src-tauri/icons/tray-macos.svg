<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 512 512">
  <!-- The macOS menu bar icon, and the only one of Kotha's icons that is not
       allowed to have a colour.

       A template image: macOS reads the alpha channel and throws the colour
       away, tinting the shape itself — black on a light menu bar, white on a
       dark one, and the highlight colour while the menu is open. So this is
       kotha.svg's k and matra with the plate removed and the red flattened
       to black, because under a template the plate would be a solid blob with
       the glyph invisible inside it.

       36 x 36 because tray-icon scales the image to 18 points tall
       (tray-icon 0.24.2, macos/mod.rs:296), and 2x of that is crisp on a
       retina display without carrying a 512 px icon for an 18 pt slot. The
       glyph fills 86% of the box rather than kotha.svg's 60%: there is no
       plate here to provide the padding, and a menu bar provides its own. -->
  <g transform="translate(-154.8 -95.4) scale(1.4580)">
    <rect x="200" y="160" width="52" height="232" fill="#000000"/>
    <path d="M226.0 318 L354 252.7"
          stroke="#000000" stroke-width="42" fill="none"/>
    <path d="M226.0 318 L354 372.7"
          stroke="#000000" stroke-width="42" fill="none"/>
    <rect x="200" y="90" width="110" height="42" fill="#000000"/>
  </g>
</svg>
