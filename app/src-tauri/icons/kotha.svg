    <rect x="148" y="204" width="24" height="104" rx="12"/>
    <rect x="192" y="152" width="24" height="208" rx="12"/>
    <rect x="236" y="116" width="24" height="280" rx="12"/>
    <rect x="280" y="172" width="24" height="168" rx="12"/>
    <rect x="324" y="220" width="24" height="72"  rx="12"/>
    <rect x="368" y="240" width="24" height="32"  rx="12"/>
  </g>
</svg>
