<!doctype html>
<!--
  Kotha — the pill.

  This whole directory is the frontend, and it is the only place you need to
  touch to change how Kotha looks. It runs in two places, from the same files:

    * inside Tauri, driven by real events from Rust
    * in any browser, driven by mock.js — no Rust, no model, no build

  So: open app/ui/index.html in a browser and edit. See the header of pill.js
  for the entire Rust↔UI contract (it is two events wide), and the token block
  at the top of pill.css for every colour and dimension.

  THE IDEA, IN ONE LINE
  --------------------
  Five bars of light that never move. Only their brightness changes — with the
  voice, with the decode, with the outcome — the way a Nothing phone's glyph
  says everything it has to say without a single thing changing shape.

  WHY THE SEGMENTS ARE WRITTEN OUT HERE
  -------------------------------------
  Because the glyph is a drawn shape, not a count. Five bars, tapering out
  from the middle, is the mark; generating them from a number would imply
  there is a right answer for six or for twenty, and there is not. Their
  widths and their chase order are in pill.css, keyed off nth-child.
-->
<html lang="en" data-state="idle">
<head>
  <meta charset="utf-8">
  <title>Kotha</title>
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <!-- The pill. Everything visible lives in here. -->
  <div class="pill" role="status" aria-live="polite">
    <div class="glyph" aria-hidden="true">
      <i class="seg"></i>
      <i class="seg"></i>
      <i class="seg"></i>
      <i class="seg"></i>
      <i class="seg"></i>
    </div>

    <!-- Screen readers get words; sighted users get the light. -->
    <span class="sr"></span>
  </div>

  <script src="pill.js"></script>
  <script src="mock.js"></script>
</body>
</html>
