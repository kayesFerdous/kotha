<!doctype html>
<!--
  Kotha — the pill.

  This whole directory is the frontend, and it is the only place you need to
  touch to change how Kotha looks. It runs in two places, from the same files:

    * inside Tauri, driven by real events from Rust
    * in any browser, driven by mock.js — no Rust, no model, no build

  So: open app/ui/index.html in a browser and edit. See the header of pill.js
  for the entire Rust↔UI contract (it is two events wide), and the token block
  at the top of pill.css for every colour and dimension.

  The markup below is deliberately thin. Bars are generated by pill.js because
  their count is a CSS token, and hard-coding twenty-one <span>s would mean two
  places to change it.
-->
<html lang="en" data-state="idle">
<head>
  <meta charset="utf-8">
  <title>Kotha</title>
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <!-- The pill. Everything visible lives in here. -->
  <div class="pill" role="status" aria-live="polite">
    <div class="wave" aria-hidden="true"></div>

    <!-- Shown only in the `done` state. -->
    <svg class="tick" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 12.5 L9.5 18 L20 6.5" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Screen readers get words; sighted users get the waveform. -->
    <span class="sr">Listening</span>
  </div>

  <script src="pill.js"></script>
  <script src="mock.js"></script>
</body>
</html>
