<!doctype html>
<!--
  Kotha — the settings window.

  Five questions, one control each, and one sentence under each that says what
  the current answer will DO. Not what every option means — what this one does,
  rewritten the moment it changes. A page that explains three paste routes in
  three paragraphs asks the reader to compare them; a page that says "Kotha
  types the text wherever your cursor is" just tells them.

  Like index.html and setup.html it opens in a plain browser and works:
  settings.js fakes the backend when there is no Tauri around it. Styles are in
  pill.css under `body.settings`.

  There is no <select> on this page, on purpose. WebKitGTK draws a select's
  open list with GTK, outside the page, in the desktop theme's colours — and
  the page's own text colour came through onto it: white on white, every
  option invisible. A dropdown here is a <details> holding a radio group, so
  the open list is page content and themes like everything else.

  The rows are written out here because they are the page's structure. The
  OPTIONS inside them are not: every list comes from Rust in settings_get, so a
  list here could never drift from what settings_set will accept.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Kotha Settings</title>
  <!-- Before the stylesheet paints anything: see the head of theme.js. -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="pill.css">
</head>
<body class="settings">

  <header>
    <!-- The app's mark: a Latin k wearing a Bengali matra. Inline so the k
         inherits the text colour and flips with the theme. -->
    <svg class="mark" viewBox="0 0 158 302" aria-hidden="true">
      <g transform="translate(-200 -90)">
        <rect x="200" y="160" width="52" height="232" fill="currentColor"/>
        <path d="M226 318 L354 252.7" stroke="currentColor" stroke-width="42" fill="none"/>
        <path d="M226 318 L354 372.7" stroke="currentColor" stroke-width="42" fill="none"/>
        <rect class="bar" x="200" y="90" width="110" height="42"/>
      </g>
    </svg>
    <h1>Settings</h1>
  </header>

  <main>
    <h2>Dictation</h2>
    <div class="group">
      <div class="row" data-key="hotkey">
        <span class="label" id="hotkey-label">Shortcut</span>
        <details class="control menu" id="hotkey"><summary aria-describedby="hotkey-label"></summary><div class="list" role="radiogroup" aria-labelledby="hotkey-label"></div></details>
        <p class="says"></p>
      </div>

      <div class="row" data-key="finish">
        <span class="label" id="finish-label">Stop dictating</span>
        <div class="control switch" id="finish" role="radiogroup" aria-labelledby="finish-label"></div>
        <p class="says"></p>
      </div>

      <div class="row" data-key="paste">
        <span class="label" id="paste-label">Put text</span>
        <details class="control menu" id="paste"><summary aria-describedby="paste-label"></summary><div class="list" role="radiogroup" aria-labelledby="paste-label"></div></details>
        <p class="says"></p>
      </div>
    </div>

    <h2>General</h2>
    <div class="group">
      <div class="row" data-key="theme">
        <span class="label" id="theme-label">Theme</span>
        <div class="control switch" id="theme" role="radiogroup" aria-labelledby="theme-label"></div>
      </div>

      <div class="row" data-key="autostart">
        <span class="label" id="autostart-label">Open at login</span>
        <div class="control switch" id="autostart" role="radiogroup" aria-labelledby="autostart-label"></div>
        <p class="says"></p>
      </div>
    </div>
  </main>

  <footer id="about"></footer>

  <script src="settings.js"></script>
</body>
</html>
