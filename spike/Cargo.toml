[package]
name    = "kotha-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Phase 0 only. This crate exists to answer one question — does ct2rs load the
# published model and produce the same text faster-whisper does — and will be
# deleted once the real app absorbs it.

[dependencies]
hound  = "3.5"    # WAV reading. Small and does one thing.
anyhow = "1"

# Both are already in the tree as ct2rs's own dependencies, at these versions.
# We need them directly because we compute the mel spectrogram ourselves rather
# than letting ct2rs do it — see the note in main.rs.
# mel_spec is used ONLY for its mel filterbank matrix. Its STFT cannot
# reproduce Whisper's framing — see the note above `log_mel` in main.rs.
mel_spec = "0.3"
ndarray  = "0.16"
rustfft  = "6.4"
cpal = "0.18.2"
earshot = "1.2.2"
num_cpus = "1.17.0"
rubato = { version = "5.0.0", default-features = false, features = ["fft_resampler"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
# Not the crates.io release. 0.6.1 throws away the portal's restore token —
# it is a `None` with a TODO next to it in `linux/libei.rs` — so KDE asks
# "allow remote control?" on every single launch. Upstream has since added
# `Settings::restore_token` in and `Enigo::restore_token()` out, which is
# exactly the round trip that makes the dialog a once-ever thing. Pinned to a
# commit, not a branch: a package built from the AUR must build the same code
# tomorrow as today.
#
# `libei_smol` split into `libei` + `smol` upstream. `platform_specific` is what
# exposes `restore_token()`.
enigo = { git = "https://github.com/enigo-rs/enigo", rev = "a88d9b7", features = ["libei", "smol", "wayland", "platform_specific"] }

# The int8 GEMM backend is target-specific, and getting it wrong costs ~2x.
#
# ct2rs's default feature set is `ruy` — Google's ARM-tuned kernel. That is the
# right choice on Apple Silicon and the wrong one on x86-64, where the fast int8
# path is oneDNN. faster-whisper's PyPI wheel ships oneDNN + MKL, which is why
# the Python build beat the first Rust build 0.669 RTF to 1.222 on a Ryzen 5600G.

[target.'cfg(target_arch = "x86_64")'.dependencies]
ct2rs = { version = "0.9", features = ["whisper", "dnnl"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
ct2rs = { version = "0.9", features = ["whisper"] }

# macOS only, and for one sysctl. `hw.perflevel0.physicalcpu` is how many
# performance cores this chip has, which on Apple Silicon is the number that
# matters and not the one `num_cpus` reports. libc has no binding for the QoS
# call next to it in `live.rs`, so that one is declared by hand; this one it
# does have.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# [profile.release] now lives in the workspace root Cargo.toml — cargo only
# honours profiles there, and keeping a copy here is a warning, not an override.
